<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت BLACKMARKSHOPING</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:15px/1.7 Tahoma,Arial}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.panel{background:#121212;border:1px solid #4a3b16;border-radius:12px;padding:22px;margin:20px 0}h1,h2{color:#d4af37}input,button,select{font:inherit;padding:11px;border-radius:7px;border:1px solid #51431d;background:#090909;color:white}input{display:block;width:100%;margin:8px 0 14px}button{background:#d4af37;color:#111;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order{border-top:1px solid #332b19;padding:14px 0}.muted{color:#aaa;font-size:12px}.hidden{display:none}.error{color:#ffb1a8}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>BLACKMARKSHOPING</h1><p class="muted">پنل مدیریت سفارش‌ها — ورود فقط برای مدیر مجاز است.</p>
<section class="panel" id="login"><h2>ورود مدیر</h2><form id="loginForm"><label>ایمیل مدیر</label><input name="email" type="email" required autocomplete="username"><label>رمز عبور</label><input name="password" type="password" required autocomplete="current-password"><button>ورود</button><div id="loginMsg" class="error"></div></form></section>
<section class="panel hidden" id="dashboard"><div class="row"><h2>سفارش‌ها</h2><button id="logout" style="align-self:center">خروج</button></div><div id="orders">در حال بارگذاری…</div></section></main>
<script>
const URL="https://bkbnwxturxoqjgwzfsdw.supabase.co",KEY="sb_publishable_L1Lc620nqQvhWpaNG_vruw_kxnc0zS7";let token="";
const headers=()=>({apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const m=document.getElementById("loginMsg");m.textContent="";try{const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw new Error(j.msg||j.message||"ورود ناموفق بود.");token=j.access_token;const a=await fetch(URL+"/rest/v1/admin_users?select=user_id&user_id=eq."+encodeURIComponent(j.user.id),{headers:headers()});const rows=await a.json();if(!a.ok||!rows.length)throw new Error("این حساب دسترسی مدیر ندارد.");document.getElementById("login").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");loadOrders()}catch(err){m.textContent=err.message}};
async function loadOrders(){const box=document.getElementById("orders");try{const r=await fetch(URL+"/rest/v1/orders?select=*,order_items(*)&order=created_at.desc&limit=100",{headers:headers()});const rows=await r.json();if(!r.ok)throw new Error("دریافت سفارش‌ها ناموفق بود.");box.innerHTML=rows.length?rows.map(o=>'<article class="order"><b>'+esc(o.order_number)+'</b> — '+esc(o.customer_name)+'<br><span class="muted">'+esc(o.phone)+' · '+esc(o.province)+' · '+esc(o.address)+'</span><p>'+esc((o.order_items||[]).map(i=>i.product_name+" × "+i.quantity).join("، "))+'</p><b>'+Number(o.total_afn).toLocaleString("fa-AF")+' افغانی</b> · '+esc(o.payment_method)+'<div class="row"><select data-status="'+o.id+'">'+["pending","confirmed","processing","shipped","delivered","cancelled","returned"].map(s=>'<option '+(o.status===s?'selected':'')+' value="'+s+'">'+s+'</option>').join("")+'</select><button data-save="'+o.id+'">ذخیره وضعیت</button></div></article>').join(""):'<p class="muted">هنوز سفارشی ثبت نشده است.</p>';box.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>updateStatus(b.dataset.save));}catch(e){box.textContent=e.message}}
async function updateStatus(id){const status=document.querySelector('[data-status="'+id+'"]').value;const r=await fetch(URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{...headers(),Prefer:"return=minimal"},body:JSON.stringify({status,updated_at:new Date().toISOString()})});if(!r.ok)alert("ذخیره وضعیت انجام نشد.");else loadOrders()}
document.getElementById("logout").onclick=()=>{token="";document.getElementById("dashboard").classList.add("hidden");document.getElementById("login").classList.remove("hidden")};
</script></body></html>
